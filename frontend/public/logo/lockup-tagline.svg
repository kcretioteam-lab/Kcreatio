<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" fill="none">
  <defs>
    <linearGradient id="kcretio-bg" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0F2B"/>
      <stop offset="1" stop-color="#050714"/>
    </linearGradient>
    <linearGradient id="kcretio-bar-t" x1="330" y1="90" x2="356" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="kcretio-upper-t" x1="352" y1="150" x2="420" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="kcretio-lower-t" x1="352" y1="150" x2="420" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#A21CAF"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#kcretio-bg)"/>

  <!-- motion accent -->
  <circle cx="176" cy="176" r="7" fill="#22D3EE"/>
  <line x1="196" y1="176" x2="222" y2="176" stroke="#22D3EE" stroke-width="7" stroke-linecap="round"/>
  <line x1="196" y1="152" x2="234" y2="152" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>

  <!-- K mark -->
  <rect x="330" y="88" width="26" height="114" rx="13" fill="url(#kcretio-bar-t)"/>
  <line x1="356" y1="150" x2="424" y2="90" stroke="url(#kcretio-upper-t)" stroke-width="26" stroke-linecap="round"/>
  <line x1="356" y1="150" x2="424" y2="212" stroke="url(#kcretio-lower-t)" stroke-width="26" stroke-linecap="round"/>

  <text x="470" y="172" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="92" letter-spacing="-2" fill="#FFFFFF">Kcretio</text>
  <circle cx="822" cy="88" r="9" fill="#6D5CFF"/>

  <text x="470" y="212" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="28" letter-spacing="2" fill="#B7BEDA">Build  ·  Create  ·  Grow</text>
</svg>
