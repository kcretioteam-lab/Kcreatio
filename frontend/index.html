<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Search shows a square raster icon (multiple of 48px); /favicon.ico must exist or Netlify serves the SPA 404 -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#07080F" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Send GST invoices brands approve, track the TDS they deduct and plan advance tax. Free for Indian YouTubers and Instagram creators who work with brands." />
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="GST invoices, TDS &amp; advance tax for Indian creators | Kcreatio" />
    <meta property="og:description" content="Send GST invoices brands approve, track the TDS they deduct and plan advance tax. Free for Indian YouTubers and Instagram creators who work with brands." />
    <meta property="og:url"         content="%SITE_URL%/" />
    <meta property="og:image"       content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name"   content="Kcreatio" />
    <meta property="og:locale"      content="en_IN" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:image"       content="%SITE_URL%/og-image.png" />
    <meta name="twitter:title"       content="GST invoices, TDS &amp; advance tax for Indian creators | Kcreatio" />
    <meta name="twitter:description" content="Send GST invoices brands approve, track the TDS they deduct and plan advance tax. Free for Indian YouTubers and Instagram creators who work with brands." />
    <title>GST invoices, TDS &amp; advance tax for Indian creators | Kcreatio</title>
    <script>
      // Apply the saved theme before first paint so the boot loader matches it
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) {}
    </script>
    <style>
      /* Shown until React mounts and replaces #root. tokens.css isn't loaded yet, so colours are inlined */
      html, body { margin: 0; background: #07080F; }
      html[data-theme="light"], html[data-theme="light"] body { background: #FAFBFC; }
      .boot-loader { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: inherit; }
      .boot-loader span { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(232, 146, 26, 0.2); border-top-color: #E8921A; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      /* Build-time SEO copy (seo.config.js): readable by crawlers, never flashed at users */
      .seo-prerender { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-loader" role="status" aria-label="Loading"><span></span></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
